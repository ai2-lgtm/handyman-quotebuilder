<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handyman.ae — Sign In</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2302265E'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23FA6006'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  .login-wrap{max-width:380px;width:100%;padding:20px;}
  .google-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#fff;color:#3c4043;border:1px solid #DCE3ED;border-radius:8px;padding:11px 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
  .google-btn:hover{background:#F8F9FA;box-shadow:0 1px 3px rgba(0,0,0,.12);}
  .login-error{color:var(--red);font-size:12.5px;margin-top:14px;display:none;line-height:1.4;text-align:center;}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="brandbar" style="justify-content:center;text-align:center;flex-direction:column;">
    <div class="logo" style="margin-bottom:8px;"></div>
    <div class="brandtext">
      <h1>Handyman.ae</h1>
      <p>GIJO Technical Services LLC · Quoting &amp; Estimating</p>
    </div>
  </div>

  <div class="card">
    <button type="button" class="google-btn" id="googleSignIn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.91C16.63 14.2 17.64 11.9 17.64 9.2z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.91-2.26c-.81.54-1.85.87-3.05.87-2.35 0-4.34-1.58-5.05-3.71H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.96a9 9 0 0 0 0 8.08l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A8.59 8.59 0 0 0 9 0 9 9 0 0 0 .96 4.96l2.99 2.33C4.66 5.16 6.65 3.58 9 3.58z"/></svg>
      Sign in with Google
    </button>
    <p class="login-error" id="authError"></p>
    <p class="hint" style="margin-top:14px;text-align:center;">Access is restricted to approved company Google accounts.</p>
  </div>
</div>

<script src="login.js"></script>
</body>
</html>
